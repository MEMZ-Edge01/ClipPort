name: 功能建议 / Feature request
description: 提议新的用户能力或工作流改进 / Propose a user capability or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索现有 Issue，未发现相同建议 / I searched existing issues for duplicates
          required: true

  - type: textarea
    attributes:
      label: 使用场景 / Use case
      description: 先说明需要解决的实际问题，而不仅是期望的界面或实现方式 / Describe the real problem before proposing an implementation
    validations:
      required: true

  - type: textarea
    attributes:
      label: 建议行为 / Proposed behavior
      description: 说明理想工作流、输入、输出和异常情况 / Describe the desired workflow, inputs, outputs, and edge cases
    validations:
      required: true

  - type: textarea
    attributes:
      label: 可选方案 / Alternatives
      description: 说明考虑过的替代方案或临时解决办法 / Describe alternatives or workarounds considered
