name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Run core tests
        run: dotnet run --project .\tests\ClipPort.CoreTests\ClipPort.CoreTests.csproj -c Release

      - name: Build and validate Release package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-beta.ps1

  fnos:
    name: Build fnOS native package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ClipPort.FnOS.Web/package-lock.json

      - name: Run fnOS backend and Linux safety tests
        run: dotnet test ./tests/ClipPort.FnOS.Tests/ClipPort.FnOS.Tests.csproj -c Release

      - name: Validate fnOS frontend
        working-directory: src/ClipPort.FnOS.Web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Build and audit FPK
        shell: pwsh
        run: ./scripts/build-fnos.ps1 -SkipChecks

      - name: Simulate fnOS lifecycle
        run: bash ./scripts/test-fnos-lifecycle.sh ./artifacts/fnos-staging

      - name: Upload fnOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipPort-fnOS-x86
          path: |
            artifacts/ClipPort-*-fnos-x86.fpk
            artifacts/ClipPort-*-fnos-x86.fpk.sha256
          if-no-files-found: error
