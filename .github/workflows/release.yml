name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, e.g. 1.0.1-beta'
        required: true
        type: string
        default: '1.0.0-beta'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Run core tests
        run: dotnet run --project .\tests\ClipPort.CoreTests\ClipPort.CoreTests.csproj -c Release

      - name: Build and package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-beta.ps1 -CreateZip

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') {
              $env:GITHUB_REF_NAME
          } else {
              "v${{ github.event.inputs.version }}"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
              throw "Invalid release tag: $tag"
          }
          $zip = Get-ChildItem -Path .\artifacts -Filter 'ClipPort-*-win-x64.zip' -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if ($null -eq $zip) {
              throw 'Release zip was not produced.'
          }
          $sha256File = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $sha256File)) {
              throw "SHA-256 file is missing: $sha256File"
          }
          # Release notes are Base64-encoded UTF-8: GitHub Actions writes
          # workflow scripts as UTF-8, which Windows PowerShell 5.1 parses
          # as ANSI, so literal Chinese text breaks the script.
          $notesBytes = [Convert]::FromBase64String(
              'Q2xpcFBvcnQgezB9Cgroh6rliqjmnoTlu7rnmoTkvr/mkLrniYjlj5HluIPljIXvvIzljIXlkKvkuLvnqIvluo/kuI7lhoXnva7mm7TmlrDlmajjgIIK6K6+572uIC0+IOWFs+S6jiAtPiDmo4Dmn6Xmm7TmlrAg5Y+v6Ieq5Yqo6I635Y+W5ZCO57ut54mI5pys44CC')
          $notes = [Text.Encoding]::UTF8.GetString($notesBytes) -f $tag
          $ghArgs = @(
              'release', 'create', $tag, $zip.FullName, $sha256File,
              '--title', "ClipPort $tag",
              '--notes', $notes
          )
          if ($tag -match 'beta|alpha|rc|preview') {
              $ghArgs += '--prerelease'
          }
          & gh @ghArgs
