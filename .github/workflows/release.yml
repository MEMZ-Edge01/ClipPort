name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, e.g. 1.0.1-beta'
        required: true
        type: string
        default: '1.0.0-beta'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Run core tests
        run: dotnet run --project .\tests\ClipPort.CoreTests\ClipPort.CoreTests.csproj -c Release

      - name: Build and package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-beta.ps1 -CreateZip

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') {
              $env:GITHUB_REF_NAME
          } else {
              "v${{ github.event.inputs.version }}"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
              throw "Invalid release tag: $tag"
          }
          $zip = Get-ChildItem -Path .\artifacts -Filter 'ClipPort-*-win-x64.zip' -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if ($null -eq $zip) {
              throw 'Release zip was not produced.'
          }
          $sha256File = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $sha256File)) {
              throw "SHA-256 file is missing: $sha256File"
          }
          $prereleaseFlag = if ($tag -match 'beta|alpha|rc|preview') { '--prerelease' } else { '' }
          $notes = "ClipPort $tag`n`n自动构建的便携版发布包，包含主程序与内置更新器。`n设置 -> 关于 -> 检查更新 可自动获取后续版本。"
          gh release create $tag $zip.FullName $sha256File `
              --title "ClipPort $tag" `
              --notes $notes `
              $prereleaseFlag
